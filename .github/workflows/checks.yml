name: Cloud API checks
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi==0.163.1 httpx==0.28.1 numpy==2.5.4 av==19.0.2 webrtcvad-wheels==2.0.14.post1
      - run: python -m unittest discover -s tests -q
      - run: python -m compileall -q cloud server app.py
